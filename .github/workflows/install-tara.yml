name: Install Tara Assistant

on:
  push:
    paths:
      - tara-assistant.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Budgetree
        uses: actions/checkout@v4

      - name: Check archive
        run: |
          test -f tara-assistant.zip || (echo "Upload tara-assistant.zip in repo root first" && exit 1)
          unzip -t tara-assistant.zip

      - name: Integrate Tara and preserve existing pages
        run: python3 scripts/install-tara.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Commit installed assistant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tara-assistant.zip
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install Tara assistant and replace old chatbot"
            git push
          fi
